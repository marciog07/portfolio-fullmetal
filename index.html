<div id="fm-site">
<style>
#fm-site{--red:#9b2024;--deep:#571116;--ink:#101012;--panel:#211d1e;--gold:#e2c77f;--paper:#f5efdf;--muted:#c9bead;color:var(--paper);background:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif;min-height:640px;position:relative;overflow-x:hidden;overflow-y:auto;box-sizing:border-box}
#fm-site *{box-sizing:border-box}#fm-site a{color:inherit}#fm-site button,#fm-site summary{font:inherit}
#fm-site .intro{min-height:640px;display:grid;place-items:center;position:relative;text-align:center;isolation:isolate;padding:42px 18px 34px;background:radial-gradient(ellipse at center,#641a1c 0,#231416 42%,#101012 78%)}
#fm-site .intro:before,#fm-site .intro:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1}
#fm-site .intro:before{background:radial-gradient(circle at 16% 28%,#e2c77f99 0 1px,transparent 2px),radial-gradient(circle at 78% 20%,#e2c77f88 0 1px,transparent 2px),radial-gradient(circle at 82% 72%,#d9473288 0 2px,transparent 3px),radial-gradient(circle at 24% 78%,#e2c77f77 0 1px,transparent 2px);animation:embers 4s ease-in-out infinite alternate}
#fm-site .intro:after{background:linear-gradient(115deg,transparent 35%,#f6dfaa14 50%,transparent 64%);animation:shine 6s ease-in-out infinite}
#fm-site .seal{width:min(67vw,370px);height:auto;position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);opacity:.22;z-index:-1;filter:drop-shadow(0 0 10px #d7aa4b);animation:turn 48s linear infinite}
#fm-site .seal .inner{transform-origin:150px 150px;animation:turnBack 32s linear infinite}
#fm-site .intro-copy{max-width:760px;position:relative}
#fm-site .eyebrow{color:var(--gold);letter-spacing:.22em;text-transform:uppercase;font:12px/1.4 Arial,sans-serif}
#fm-site .intro h1{font-size:clamp(34px,7.5vw,68px);line-height:1.06;margin:12px 0;color:var(--paper);text-shadow:0 0 24px #a42b28a8}
#fm-site .intro p{color:var(--muted);font-size:clamp(16px,2.4vw,20px);margin:0 auto 24px}
#fm-site .rank{display:flex;align-items:center;justify-content:center;gap:11px;margin:0 auto 20px;padding:9px 15px;width:max-content;max-width:100%;border:1px solid #a98d50;background:#171415bb;color:var(--gold);text-align:left;box-shadow:0 0 18px #c79e3c22}
#fm-site .rank svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 5px #e2c77f66)}
#fm-site .rank svg.ouro{width:34px;height:34px}
#fm-site .rank b,#fm-site .rank small{display:block}#fm-site .rank b{font:12px/1.3 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}#fm-site .rank small{color:var(--muted);font-size:12px}
#fm-site .equivalent{margin:14px 0 0!important;color:var(--gold)!important;font-size:14px!important;font-style:italic}
#fm-site .enter{display:inline-block;padding:12px 22px;background:linear-gradient(110deg,var(--deep),var(--red));border:1px solid var(--gold);color:var(--paper);text-decoration:none;letter-spacing:.08em;box-shadow:0 0 18px #a42b2855;transition:transform .2s,box-shadow .2s;cursor:pointer}
#fm-site .enter:hover,#fm-site .enter:focus{transform:translateY(-2px);box-shadow:0 0 26px #d8ae61a0}
#fm-site .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px clamp(14px,3vw,28px);background:#151314;border-bottom:1px solid #5a3434;position:sticky;top:0;z-index:5}
#fm-site .brand{color:var(--gold);text-decoration:none;font-size:18px;cursor:pointer;background:none;border:0;padding:0;transition:opacity .2s}
#fm-site .brand:hover{opacity:.85}
#fm-site .nav-row{display:flex;flex-wrap:wrap;gap:8px;padding:10px clamp(14px,3vw,28px);background:#191516;border-bottom:1px solid #3a2627}
#fm-site .nav-btn{background:#241a1b;border:1px solid #694042;color:var(--paper);padding:6px 11px;font-size:13px;cursor:pointer;transition:transform .18s,background .2s,border-color .2s,color .2s}
#fm-site .nav-btn:hover,#fm-site .nav-btn.active{transform:translateY(-1px);background:var(--deep);border-color:var(--gold);color:var(--gold)}
#fm-site .view{min-height:510px;padding:clamp(18px,4vw,38px);animation:appear .35s ease-out}
#fm-site .view-head{border-left:4px solid var(--red);padding:4px 0 4px 16px;margin:0 0 22px}
#fm-site h2{font-size:clamp(27px,4vw,40px);line-height:1.15;color:var(--gold);margin:0 0 7px}
#fm-site .subhead{color:var(--muted);margin:0}
#fm-site .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#fm-site .card{padding:17px;background:linear-gradient(145deg,#292123,#1b191a);border:1px solid #503233;border-top:2px solid var(--red);box-shadow:0 6px 18px #0004;min-width:0;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
#fm-site .card:hover{transform:translateY(-2px);border-color:#7d4949;box-shadow:0 10px 24px #0007}
#fm-site .card:before{content:"✦";position:absolute;right:11px;top:7px;color:var(--gold);opacity:.45;font-size:12px}
#fm-site .work:after{content:"⚙";position:absolute;right:10px;bottom:5px;color:var(--gold);opacity:.23;font-size:17px}
#fm-site .card h3{color:#f1dfb5;font-size:20px;line-height:1.25;margin:0 0 9px}
#fm-site .card p{margin:0;color:#eee6d8}
#fm-site .unit-link{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;min-height:92px;transition:transform .18s,border-color .18s,box-shadow .18s;cursor:pointer}
#fm-site .unit-link:hover,#fm-site .unit-link:focus{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 22px #c79e3c22}
#fm-site .unit-link span:last-child{color:var(--gold);font-size:24px;transition:transform .2s}
#fm-site .unit-link:hover span:last-child{transform:translateX(3px)}
#fm-site .crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:0 0 16px}
#fm-site .crumb button{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline}
#fm-site .back{display:inline-block;margin-top:20px;padding:8px 12px;border:1px solid #694042;background:#241a1b;color:var(--paper);cursor:pointer;transition:transform .18s,border-color .18s,background .18s}
#fm-site .back:hover,#fm-site .back:focus{transform:translateY(-1px);border-color:var(--gold);background:var(--deep)}
#fm-site .quote{margin-top:14px;padding:15px 18px;background:linear-gradient(100deg,var(--deep),#301719);border-left:3px solid var(--gold);font-size:18px;animation:appear .4s ease-out}
#fm-site .foot{text-align:center;padding:13px;color:var(--muted);border-top:1px solid #493536;font-size:13px}
#fm-site .page-flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle,#f6d98155,transparent 60%);animation:flash .35s ease-out forwards}
@keyframes turn{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes turnBack{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes embers{0%{opacity:.25;transform:translateY(0)}to{opacity:.5;transform:translateY(-6px)}}
@keyframes shine{0%,100%{opacity:0;transform:translateX(-18%)}45%{opacity:1}70%{opacity:0;transform:translateX(18%)}}
@keyframes flash{from{opacity:.75}to{opacity:0}}
@media(max-width:620px){#fm-site .cards{grid-template-columns:1fr}#fm-site .topbar{align-items:flex-start}#fm-site .brand{font-size:16px}#fm-site .intro{min-height:560px}}
@media(prefers-reduced-motion:reduce){#fm-site *,#fm-site *:before,#fm-site *:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
